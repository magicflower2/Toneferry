<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F0F23" />
    <meta name="color-scheme" content="dark" />
    <title>Toneferry · 系统音频实时收听</title>
    <link rel="icon" href="/icon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Righteous&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-primary: #1e1b4b;
        --color-on-primary: #ffffff;
        --color-secondary: #4338ca;
        --color-on-secondary: #ffffff;
        --color-accent: #22c55e;
        --color-accent-hover: #4ade80;
        --color-on-accent: #0f172a;
        --color-background: #0f0f23;
        --color-foreground: #f8fafc;
        --color-card: #1b1b30;
        --color-card-foreground: #f8fafc;
        --color-muted: #27273b;
        --color-muted-foreground: #94a3b8;
        --color-border: #312e81;
        --color-destructive: #ef4444;
        --color-ring: #ffffff;
        --color-success: #22c55e;

        --glass: rgba(255, 255, 255, 0.06);
        --glass-strong: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.14);
        --blur-amount: 18px;

        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-2xl: 48px;

        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --radius-xl: 32px;
        --radius-full: 999px;

        --font-display: Righteous, "Segoe UI", sans-serif;
        --font-body:
          Poppins, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;

        --shadow-cta: 0 12px 32px rgba(34, 197, 94, 0.28);
        --header-height: 64px;
        --controls-height: 88px;

        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        color-scheme: dark;
        scroll-padding-bottom: var(--controls-height);
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--color-foreground);
        background: var(--color-background);
        min-height: 100dvh;
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          0
          max(12px, env(safe-area-inset-left));
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      :focus-visible {
        outline: 2px solid var(--color-ring);
        outline-offset: 3px;
      }

      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background:
          radial-gradient(
            70% 50% at 12% -8%,
            rgba(67, 56, 202, 0.42),
            transparent 58%
          ),
          radial-gradient(
            55% 45% at 92% 8%,
            rgba(34, 197, 94, 0.16),
            transparent 55%
          ),
          radial-gradient(
            50% 40% at 50% 110%,
            rgba(30, 27, 75, 0.9),
            transparent 60%
          ),
          var(--color-background);
      }

      .ambient::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image: radial-gradient(
          rgba(248, 250, 252, 0.06) 0.6px,
          transparent 0.6px
        );
        background-size: 18px 18px;
      }

      .app {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1120px;
        min-width: 0;
        margin: 0 auto;
        min-height: calc(100dvh - 12px);
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }

      .header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-sm);
        min-height: 52px;
        padding: 4px 2px 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-icon {
        flex: none;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        overflow: hidden;
        background: transparent;
        box-shadow: 0 10px 24px rgba(67, 56, 202, 0.35);
      }

      .brand-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .brand-icon svg {
        width: 22px;
        height: 22px;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-title {
        font-family: var(--font-display);
        font-size: 18px;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }

      .brand-subtitle {
        margin-top: 3px;
        font-size: 12px;
        font-weight: 500;
        color: var(--color-muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .connection {
        flex: none;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: min(46vw, 240px);
        padding: 8px 12px;
        border-radius: var(--radius-full);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(var(--blur-amount));
        -webkit-backdrop-filter: blur(var(--blur-amount));
        font-size: 12px;
        font-weight: 600;
        color: var(--color-muted-foreground);
      }

      .connection span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .connection-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-muted-foreground);
      }

      .connection-dot.on {
        background: var(--color-success);
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
      }

      .player-card {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        background: linear-gradient(
          180deg,
          rgba(27, 27, 48, 0.88),
          rgba(15, 15, 35, 0.92)
        );
        border: 1px solid var(--glass-border);
        border-bottom: 0;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(var(--blur-amount));
        -webkit-backdrop-filter: blur(var(--blur-amount));
      }

      .player-card.is-live {
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(34, 197, 94, 0.18),
          0 0 60px rgba(34, 197, 94, 0.08);
      }

      .player-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        padding: var(--space-md);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-md);
        text-align: center;
      }

      .disc-wrap {
        position: relative;
        width: min(48vw, 196px);
        aspect-ratio: 1;
      }

      .live-pill {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-full);
        background: rgba(15, 15, 35, 0.72);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--color-muted-foreground);
      }

      .live-pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-destructive);
      }

      .live-pill .dot.on {
        background: var(--color-success);
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      }

      .visualizer {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 22%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, rgba(99, 102, 241, 0.28), transparent 42%),
          radial-gradient(circle at 70% 70%, rgba(34, 197, 94, 0.16), transparent 46%),
          linear-gradient(160deg, #1e1b4b, #0f0f23 70%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 0 0 10px rgba(255, 255, 255, 0.03),
          0 18px 50px rgba(67, 56, 202, 0.28);
      }

      .player-card.is-live .visualizer {
        box-shadow:
          0 0 0 10px rgba(34, 197, 94, 0.06),
          0 0 48px rgba(34, 197, 94, 0.18),
          0 18px 50px rgba(67, 56, 202, 0.28);
      }

      .wave {
        width: 4px;
        height: 18px;
        border-radius: var(--radius-full);
        background: linear-gradient(to top, #4338ca, #86efac);
        opacity: 0.4;
        transform-origin: center;
        animation: wave 1.15s ease-in-out infinite;
        animation-play-state: paused;
      }

      .visualizer.active .wave {
        animation-play-state: running;
      }

      .wave:nth-child(1) { height: 16px; animation-delay: -0.95s; }
      .wave:nth-child(2) { height: 28px; animation-delay: -0.86s; }
      .wave:nth-child(3) { height: 44px; animation-delay: -0.74s; }
      .wave:nth-child(4) { height: 32px; animation-delay: -0.62s; }
      .wave:nth-child(5) { height: 58px; animation-delay: -0.5s; }
      .wave:nth-child(6) { height: 40px; animation-delay: -0.38s; }
      .wave:nth-child(7) { height: 72px; animation-delay: -0.26s; }
      .wave:nth-child(8) { height: 36px; animation-delay: -0.18s; }
      .wave:nth-child(9) { height: 52px; animation-delay: -0.4s; }
      .wave:nth-child(10) { height: 24px; animation-delay: -0.68s; }
      .wave:nth-child(11) { height: 64px; animation-delay: -0.12s; }
      .wave:nth-child(12) { height: 30px; animation-delay: -0.8s; }
      .wave:nth-child(13) { height: 46px; animation-delay: -0.32s; }
      .wave:nth-child(14) { height: 20px; animation-delay: -0.9s; }
      .wave:nth-child(15) { height: 38px; animation-delay: -0.54s; }
      .wave:nth-child(16) { height: 18px; animation-delay: -1s; }

      @keyframes wave {
        0%,
        100% {
          transform: scaleY(0.28);
          opacity: 0.32;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .copy {
        width: 100%;
      }

      .kicker {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a5b4fc;
      }

      .hero-title {
        margin: 0;
        font-size: clamp(28px, 8vw, 42px);
        line-height: 1.18;
        letter-spacing: -0.03em;
        font-weight: 700;
        text-shadow: 0 0 18px rgba(99, 102, 241, 0.18);
      }

      .hero-description {
        max-width: 38rem;
        margin: 10px auto 0;
        color: var(--color-muted-foreground);
        font-size: 13px;
        line-height: 1.7;
        text-wrap: pretty;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-sm);
        width: 100%;
      }

      .stat {
        min-width: 0;
        padding: 12px 10px;
        border-radius: var(--radius-md);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        text-align: left;
      }

      .stat-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-muted-foreground);
      }

      .stat-value {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 700;
        color: var(--color-card-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stat-unit {
        display: none;
        font-size: 11px;
        font-weight: 500;
        color: var(--color-muted-foreground);
      }

      .buffer {
        width: 100%;
      }

      .buffer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-sm);
        margin-bottom: 10px;
      }

      .buffer-label,
      .buffer-value {
        font-size: 12px;
        font-weight: 600;
      }

      .buffer-label {
        color: var(--color-muted-foreground);
      }

      .buffer-value {
        color: var(--color-foreground);
      }

      .buffer-track {
        height: 6px;
        overflow: hidden;
        border-radius: var(--radius-full);
        background: var(--color-muted);
      }

      .buffer-progress {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4338ca, #22c55e);
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
        transition: width 100ms linear;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: stretch;
        gap: var(--space-sm);
        width: 100%;
        min-width: 0;
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin-top: auto;
        padding:
          12px 0
          max(12px, env(safe-area-inset-bottom));
        background: linear-gradient(
          180deg,
          rgba(15, 15, 35, 0),
          rgba(15, 15, 35, 0.94) 28%
        );
      }

      .primary-button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 52px;
        border: 0;
        border-radius: 16px;
        font-weight: 700;
        white-space: nowrap;
        transition:
          background 200ms var(--ease),
          box-shadow 200ms var(--ease),
          filter 200ms var(--ease),
          opacity 200ms var(--ease);
      }

      .primary-button svg,
      .secondary-button svg {
        width: 18px;
        height: 18px;
        flex: none;
      }

      .primary-button {
        min-width: 0;
        width: 100%;
        color: var(--color-on-accent);
        background: var(--color-accent);
        box-shadow: var(--shadow-cta);
      }

      .primary-button:hover:not(:disabled) {
        background: var(--color-accent-hover);
      }

      .primary-button:active:not(:disabled) {
        filter: brightness(0.94);
      }

      .secondary-button {
        flex: 0 0 auto;
        min-width: 96px;
        padding: 0 14px;
        color: var(--color-foreground);
        background: var(--color-muted);
        border: 1px solid var(--glass-border);
      }

      .secondary-button:hover:not(:disabled) {
        background: #32324a;
      }

      .secondary-button:active:not(:disabled) {
        filter: brightness(0.94);
      }

      button:disabled {
        opacity: 0.42;
        box-shadow: none;
        filter: none;
      }

      .footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 10px 4px 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: var(--radius-full);
        background: rgba(27, 27, 48, 0.7);
        border: 1px solid rgba(49, 46, 129, 0.55);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--color-muted-foreground);
      }

      @media (min-width: 640px) {
        body {
          padding:
            max(20px, env(safe-area-inset-top))
            max(20px, env(safe-area-inset-right))
            max(20px, env(safe-area-inset-bottom))
            max(20px, env(safe-area-inset-left));
          align-items: center;
        }

        .app {
          min-height: unset;
          padding-bottom: 0;
        }

        .header {
          min-height: var(--header-height);
          padding: var(--space-sm) 2px var(--space-md);
          gap: var(--space-md);
        }

        .player-card {
          border-radius: var(--radius-xl);
          border-bottom: 1px solid var(--glass-border);
        }

        .player-body {
          padding: var(--space-xl);
          gap: var(--space-lg);
        }

        .stage {
          gap: var(--space-lg);
        }

        .disc-wrap {
          width: min(58vw, 320px);
        }

        .hero-description {
          font-size: 14px;
          line-height: 1.75;
        }

        .controls {
          position: static;
          margin: var(--space-md) 0 0;
          padding: 0;
          background: none;
        }

        .secondary-button {
          min-width: 112px;
          padding: 0 18px;
        }

        .stat {
          padding: 16px 18px;
        }

        .stat-value {
          font-size: 18px;
        }

        .stat-unit {
          display: inline;
        }
      }

      @media (min-width: 900px) {
        .player-body {
          display: grid;
          grid-template-columns: 340px minmax(0, 1fr);
          grid-template-areas:
            "disc copy"
            "disc stats"
            "disc buffer"
            "disc controls";
          align-items: center;
          column-gap: var(--space-2xl);
          row-gap: var(--space-md);
          padding: 40px 44px;
        }

        .stage {
          display: contents;
        }

        .disc-wrap {
          grid-area: disc;
          width: 320px;
          justify-self: center;
        }

        .copy {
          grid-area: copy;
          text-align: left;
        }

        .hero-description {
          margin-left: 0;
        }

        .stats {
          grid-area: stats;
        }

        .buffer {
          grid-area: buffer;
        }

        .controls {
          grid-area: controls;
          width: 100%;
        }

        .hero-title {
          font-size: 44px;
        }
      }

      @media (min-width: 1200px) {
        .app {
          width: min(1120px, 100%);
        }
      }

      @media (max-width: 639px) {
        .brand-subtitle {
          display: none;
        }

        .hero-title {
          font-size: clamp(26px, 7.2vw, 34px);
        }

        .connection {
          max-width: 42vw;
          padding: 7px 10px;
          font-size: 11px;
        }

        .chip {
          font-size: 10px;
          padding: 5px 8px;
        }
      }

      @media (max-width: 379px) {
        .secondary-button {
          min-width: 88px;
          padding: 0 10px;
        }

        .stat-value {
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .wave {
          transform: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>

  <body>
    <div class="ambient" aria-hidden="true"></div>

    <main class="app">
      <header class="header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <img src="/icon.png" alt="" width="28" height="28" />
          </div>
          <div class="brand-copy">
            <div class="brand-title">Toneferry</div>
            <div class="brand-subtitle">PC audio → phone</div>
          </div>
        </div>

        <div class="connection" role="status">
          <i id="statusDot" class="connection-dot"></i>
          <span id="statusText">未连接</span>
        </div>
      </header>

      <section class="player-card" id="playerCard">
        <div class="player-body">
          <div class="stage">
            <div class="disc-wrap">
              <div class="live-pill">
                <i id="statusBadgeDot" class="dot"></i>
                <span>实时音频</span>
              </div>

              <div id="visualizer" class="visualizer" aria-label="音频波形">
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
                <i class="wave"></i>
              </div>
            </div>

            <div class="copy">
              <p class="kicker">WASAPI Loopback</p>
              <h1 class="hero-title">系统音频<br />实时收听</h1>
              <p class="hero-description">
                通过 WASAPI Loopback 获取 Windows 正在播放的系统音频，经
                WebSocket 实时传输到当前设备。
              </p>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">采样率</div>
              <div id="sampleRate" class="stat-value">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">声道</div>
              <div id="channels" class="stat-value">—</div>
            </div>
            <div class="stat">
              <div class="stat-label">缓冲</div>
              <div class="stat-value">
                <span id="buffered">0</span>
                <span class="stat-unit">frames</span>
              </div>
            </div>
          </div>

          <div class="buffer">
            <div class="buffer-header">
              <span class="buffer-label">网络 / 播放缓冲</span>
              <span id="bufferText" class="buffer-value">0 frames</span>
            </div>
            <div class="buffer-track">
              <div id="level" class="buffer-progress"></div>
            </div>
          </div>

          <div class="controls">
            <button id="btnStart" class="primary-button" type="button">
              <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path
                  d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.32.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8-13.82,16,16,0,0,1,16.32.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"
                />
              </svg>
              开始收听
            </button>
            <button id="btnStop" class="secondary-button" type="button" disabled>
              <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path
                  d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z"
                />
              </svg>
              停止
            </button>
          </div>
        </div>
      </section>

      <div class="footer">
        <span class="chip">实时传输</span>
        <span class="chip">WebSocket</span>
        <span class="chip">WASAPI Loopback</span>
      </div>
    </main>

    <script type="module">
      import "./app.js";

      const visualizer = document.getElementById("visualizer");
      const playerCard = document.getElementById("playerCard");
      const statusDot = document.getElementById("statusDot");
      const statusBadgeDot = document.getElementById("statusBadgeDot");
      const statusText = document.getElementById("statusText");
      const btnStart = document.getElementById("btnStart");
      const btnStop = document.getElementById("btnStop");
      const buffered = document.getElementById("buffered");
      const bufferText = document.getElementById("bufferText");

      const updateUI = () => {
        const running = btnStop.disabled === false;
        const connected =
          statusText.textContent.trim() !== "未连接" &&
          statusText.textContent.trim() !== "连接失败" &&
          statusText.textContent.trim() !== "已停止" &&
          statusText.textContent.trim() !== "连接已断开" &&
          !statusText.textContent.includes("已暂停");

        const live = running || connected;

        visualizer.classList.toggle("active", running);
        playerCard.classList.toggle("is-live", live);
        statusDot.classList.toggle("on", live);
        statusBadgeDot.classList.toggle("on", live);
      };

      const observer = new MutationObserver(updateUI);
      observer.observe(statusText, {
        childList: true,
        subtree: true,
        characterData: true,
      });

      const syncBuffer = new MutationObserver(() => {
        bufferText.textContent = `${buffered.textContent.trim()} frames`;
      });
      syncBuffer.observe(buffered, {
        childList: true,
        subtree: true,
        characterData: true,
      });

      const buttonObserver = new MutationObserver(updateUI);
      buttonObserver.observe(btnStop, {
        attributes: true,
        attributeFilter: ["disabled"],
      });

      updateUI();
    </script>
  </body>
</html>
